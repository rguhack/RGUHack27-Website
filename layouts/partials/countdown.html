<script>
document.addEventListener("DOMContentLoaded", () => {

    const countdown = document.getElementById("countdown");

    if (!countdown) {
        console.error("Countdown div not found");
        return;
    }

    const targetDate = new Date(countdown.dataset.date).getTime();

    const daysEl = countdown.querySelector(".days");
    const hoursEl = countdown.querySelector(".hours");
    const minutesEl = countdown.querySelector(".minutes");
    const secondsEl = countdown.querySelector(".seconds");

    function update() {
        const diff = targetDate - Date.now();

        if (diff <= 0) {
            countdown.innerHTML = "<strong>Event Started!</strong>";
            return;
        }

        const days = Math.floor(diff / 86400000);
        const hours = Math.floor(diff / 3600000) % 24;
        const minutes = Math.floor(diff / 60000) % 60;
        const seconds = Math.floor(diff / 1000) % 60;

        daysEl.textContent = days;
        hoursEl.textContent = String(hours).padStart(2, "0");
        minutesEl.textContent = String(minutes).padStart(2, "0");
        secondsEl.textContent = String(seconds).padStart(2, "0");
    }

    update();
    setInterval(update, 1000);
});
</script>

<div id="countdown" class="countdown" data-date="{{ . }}">
    <div class="countdown-item">
        <span class="countdown-value days">0</span>
        <span class="countdown-label">Days</span>
    </div>

    <div class="countdown-item">
        <span class="countdown-value hours">00</span>
        <span class="countdown-label">Hours</span>
    </div>

    <div class="countdown-item">
        <span class="countdown-value minutes">00</span>
        <span class="countdown-label">Minutes</span>
    </div>

    <div class="countdown-item">
        <span class="countdown-value seconds">00</span>
        <span class="countdown-label">Seconds</span>
    </div>
</div>
